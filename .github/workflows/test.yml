name: Automated Tests

on: [push, pull_request]

jobs:
  rust-tests:
    name: Rust unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        working-directory: Payload_Type/linky/agent_code
        run: cargo fmt --check --all

      - name: Run Rust unit tests
        working-directory: Payload_Type/linky/agent_code
        env:
          CALLBACK: x
          IMPLANT_SECRET: x
          PAYLOAD_UUID: x
          CALLBACK_URI: /
        run: cargo test --workspace

  rust-cross-check:
    name: Cross-compile check (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-gnu
          - x86_64-apple-darwin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compile dependencies
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      # `ring` (pulled in by ureq+rustls) cannot build for x86_64-apple-darwin
      # on a Linux runner: its build script emits macOS-only cc flags
      # (-arch, -mmacosx-version-min) that no Linux toolchain understands.
      # cargo-zigbuild routes C compilation through `zig cc`, which knows how to
      # target darwin from Linux. See ring issue #1442.
      - name: Install zig (macOS cross-compile)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          # mlugg/setup-zig@v1 fetches from ziglang.org/builds (dev builds only)
          # and 404s; install a stable release tarball directly instead.
          set -euo pipefail
          ZIG_VERSION=0.16.0
          curl -sSfL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          mkdir -p /opt/zig
          tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild (macOS cross-compile)
        if: matrix.target == 'x86_64-apple-darwin'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Cargo check for ${{ matrix.target }}
        working-directory: Payload_Type/linky/agent_code
        env:
          CALLBACK: x
          IMPLANT_SECRET: x
          PAYLOAD_UUID: x
          CALLBACK_URI: /
        # macOS target uses cargo-zigbuild so `ring`'s C sources compile via zig cc.
        # Note: recent cargo-zigbuild releases dropped the `--check` flag, so we run
        # a full zigbuild (debug profile) to validate compilation.
        run: |
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            cargo zigbuild --target ${{ matrix.target }}
          else
            cargo check --target ${{ matrix.target }}
          fi

  go-build:
    name: Go build check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download Go modules
        working-directory: Payload_Type/linky
        # go mod tidy syncs go.sum with go.mod (the committed go.sum was stale
        # w.r.t. MythicContainer v1.7.0-rc4, which broke `go mod download`).
        run: go mod tidy

      - name: Build Go payload type
        working-directory: Payload_Type/linky
        run: go build ./...

      - name: Run go vet
        working-directory: Payload_Type/linky
        run: go vet ./...
