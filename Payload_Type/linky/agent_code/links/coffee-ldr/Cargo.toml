[package]
name = "coffee-ldr"
version = "0.2.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Vendored COFF loader (fork of hakaioffsec/coffee) for the linky BOF runtime"
publish = false

[dependencies]
base64 = "0.22"
byteorder = "1.5"
widestring = "1.2"
tracing = "0.1"
goblin = { version = "0.10", features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
] }
