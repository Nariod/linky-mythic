[package]
name = "link-windows"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "link-windows"
path = "src/main.rs"

[features]
# Conditional command compilation (P5): every feature is on by default.
# The Mythic builder disables individual commands via --no-default-features
# --features cmd-... (see builder.go "commands" build parameter).
default = [
    "cmd-whoami",
    "cmd-info",
    "cmd-ps",
    "cmd-netstat",
    "cmd-shell",
    "cmd-execute",
    "cmd-download",
    "cmd-upload",
    "cmd-inject",
    "cmd-integrity",
    "cmd-amsi-etw",
    "cmd-bof",
]
indirect-syscalls = ["dep:syscalls"]
cmd-whoami = []
cmd-info = []
cmd-ps = []
cmd-netstat = []
cmd-shell = []
cmd-execute = ["link-common/cmd-execute"]
cmd-download = ["link-common/cmd-download"]
cmd-upload = ["link-common/cmd-upload"]
cmd-inject = []
cmd-integrity = []
cmd-amsi-etw = []
cmd-bof = ["dep:coffee-ldr"]

[dependencies]
link-common = { path = "../common" }
base64      = "0.22"
coffee-ldr  = { path = "../coffee-ldr", optional = true }
num_cpus    = "1.16"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
] }
winapi = { version = "0.3", features = ["memoryapi", "processthreadsapi", "winnt", "libloaderapi", "errhandlingapi"] }
syscalls = { git = "https://github.com/Nariod/syscalls-rs", features = ["_INDIRECT_"], optional = true }
